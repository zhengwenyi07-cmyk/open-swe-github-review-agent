[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "open-swe-github-review-agent"
version = "0.1.0"
description = "A minimal, local-first Git diff review research prototype based on Open SWE reviewer boundaries."
requires-python = ">=3.12,<3.13"
dependencies = [
  "jsonschema==4.25.1",
  "langchain-openai==1.4.1",
]

[tool.setuptools.packages.find]
where = ["src"]
